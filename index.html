<!DOCTYPE html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#079AA9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#061618" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Meal Planner — plan nutritionnel halal 60 jours et liste de courses. 100 % local, offline." />
    <meta name="app-version" content="7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meal Planner" />
    <meta name="application-name" content="Meal Planner" />
    <meta name="msapplication-TileColor" content="#079AA9" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>Meal Planner</title>
  </head>
  <body>
    <div id="app"></div>
    <div id="install-banner" class="install-banner" hidden>
      <div class="install-banner-text">
        <strong>Installer Meal Planner</strong>
        <span>Accès rapide · fonctionne hors ligne</span>
      </div>
      <button type="button" class="btn btn-accent" id="install-btn">Installer</button>
      <button type="button" class="icon-btn" id="install-dismiss" aria-label="Fermer">×</button>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
